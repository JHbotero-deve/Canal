services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: canal
      POSTGRES_USER: canal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  pgdata:
